spring:
  data:
    mongodb:
      uri: ${PRODUCT_DB_URL}
      username: ${PRODUCT_DB_USER}
      password: ${PRODUCT_DB_PASSWORD}
      database: bakery_products
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT_PRODUCT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
    username: elastic
    password: ${ELASTIC_PASSWORD}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
r2:
  endpoint: ${R2_ENDPOINT}
  cdn-base-url: ${R2_CDN_URL}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}

product:
  inventory:
    low-stock-threshold: ${PRODUCT_LOW_STOCK:10}
